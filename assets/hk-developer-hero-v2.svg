<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">Hassan Khan — HK-DEVELOPER</title><desc id="desc">Animated midnight-blue and cyan developer banner with an abstract portrait frame, circuit traces, and a hooded coder illustration.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#020713"/><stop offset=".55" stop-color="#06152a"/><stop offset="1" stop-color="#090c20"/></linearGradient>
 <linearGradient id="cyan"><stop stop-color="#00d9ff"/><stop offset=".52" stop-color="#26a9ff"/><stop offset="1" stop-color="#7c6cff"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#008cff" stop-opacity=".3"/><stop offset="1" stop-color="#008cff" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#54baff" stroke-opacity=".07"/></pattern>
 <filter id="glow" x="-.7" y="-.7" width="2.4" height="2.4"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="340" rx="22" fill="url(#bg)"/><rect width="1200" height="340" rx="22" fill="url(#grid)"/>
<ellipse cx="162" cy="170" rx="210" ry="205" fill="url(#aura)"/><ellipse cx="1015" cy="185" rx="260" ry="210" fill="url(#aura)"/>
<!-- animated circuit traces -->
<g fill="none" stroke="url(#cyan)" stroke-width="2" opacity=".68">
 <path d="M0 44h75l28-28h95"/><path d="M0 284h100l33 33h95"/><path d="M1200 55h-92l-30 30h-74"/><path d="M1200 286h-118l-30-30h-76"/>
 <path d="M52 0v36l25 25"/><path d="M1130 0v26l-24 24"/>
</g>
<path d="M0 299 C230 260 345 322 540 278 S905 310 1200 263" fill="none" stroke="#00c8ff" stroke-width="2" stroke-dasharray="10 12" opacity=".6"><animate attributeName="stroke-dashoffset" from="0" to="-176" dur="9s" repeatCount="indefinite"/></path>
<!-- avatar-inspired neon portrait frame -->
<g filter="url(#glow)">
 <circle cx="163" cy="168" r="105" fill="#07182b" stroke="#00cfff" stroke-width="3"><animate attributeName="stroke-opacity" values=".55;1;.55" dur="3s" repeatCount="indefinite"/></circle>
 <circle cx="163" cy="168" r="91" fill="none" stroke="#287dff" stroke-width="1.5" stroke-dasharray="4 8"><animateTransform attributeName="transform" type="rotate" from="0 163 168" to="360 163 168" dur="28s" repeatCount="indefinite"/></circle>
</g>
<!-- abstract developer silhouette in portrait -->
<path d="M105 241c5-37 20-55 39-62-17-18-14-48 4-62 23-18 57-5 62 24 3 17-3 30-15 40 27 11 42 31 46 60z" fill="#102743" stroke="#37d6ff" stroke-width="2"/>
<path d="M138 143c7-28 49-36 67-9-13-7-21-6-32-3-10 3-20 10-35 12z" fill="#07101f"/><path d="M147 169q15 8 31 0" fill="none" stroke="#a5f3fc" stroke-width="2"/><path d="M155 184h20" stroke="#27c9ff" stroke-width="2"/>
<circle cx="163" cy="168" r="117" fill="none" stroke="#00d9ff" stroke-width="2" opacity=".3"><animate attributeName="r" values="114;121;114" dur="3.6s" repeatCount="indefinite"/></circle>
<!-- title -->
<text x="315" y="77" font-family="Arial,sans-serif" font-size="17" letter-spacing="5" fill="#45d9ff">HELLO, I'M</text>
<text x="312" y="140" font-family="Arial,sans-serif" font-size="58" font-weight="700" letter-spacing="1" fill="#f4f9ff">HASSAN <tspan fill="#00d7f5">KHAN</tspan></text>
<text x="316" y="178" font-family="Arial,sans-serif" font-size="15" letter-spacing="1.4" fill="#b9d8f8">AI APPLICATION DEVELOPER  |  FULL-STACK DEVELOPER</text>
<text x="316" y="202" font-family="Arial,sans-serif" font-size="15" letter-spacing="1.4" fill="#b9d8f8">TECH ENTHUSIAST</text>
<path d="M316 218h553" stroke="#168dcb" stroke-opacity=".6"/>
<text x="316" y="247" font-family="Arial,sans-serif" font-size="18" fill="#e0f2ff">Turning ideas into real-world digital solutions.</text>
<text x="316" y="286" font-family="cursive" font-size="25" font-style="italic" fill="#22ceff">Build  •  Learn  •  Grow</text>
<!-- hooded coder and holographic code panels -->
<g transform="translate(905 48)">
 <path d="M129 34c-33-7-66 13-75 48l-12 51c-27 17-39 40-43 75h215c-4-41-20-66-55-82-2-44-6-78-30-92z" fill="#071222" stroke="#138bdc" stroke-width="2"/>
 <path d="M74 84c16-24 51-32 71-8l12 39-45 20-46-19z" fill="#020914" stroke="#00cfff" stroke-width="1.5"/>
 <path d="M88 101q25-15 48 0" fill="none" stroke="#49d9ff" stroke-width="2"/>
 <path d="M52 137l-39 42 29 34 38-32" fill="#0b1b31" stroke="#167dd1" stroke-width="2"/>
 <path d="M171 138l36 44-31 28-37-33" fill="#0b1b31" stroke="#167dd1" stroke-width="2"/>
 <path d="M76 191h91l22 17H54z" fill="#0b2038" stroke="#18b8f6" stroke-width="2"/>
 <rect x="85" y="144" width="76" height="48" rx="3" fill="#09213b" stroke="#25bdff" transform="rotate(-8 85 144)"/>
 <path d="M94 158h41m-40 9h51m-48 9h32" stroke="#62dcff" stroke-width="2" opacity=".8"/>
</g>
<g transform="translate(777 88)" filter="url(#glow)"><path d="M0 12l77-28 15 70-77 28z" fill="#07182d" stroke="#1abfff" stroke-width="2"/><path d="M14 7l48-17m-44 28l57-20m-54 31l38-13" stroke="#63dfff" stroke-width="2"/></g>
<text x="1005" y="35" font-family="monospace" font-size="14" letter-spacing="2" fill="#55dcff">‹› HK-DEVELOPER ‹›</text>
<text x="1100" y="124" font-family="Georgia,serif" font-size="16" font-style="italic" text-anchor="middle" fill="#d4eaff">“Better Code</text><text x="1100" y="146" font-family="Georgia,serif" font-size="16" font-style="italic" text-anchor="middle" fill="#d4eaff">Bigger Dreams”</text>
<circle cx="244" cy="72" r="3" fill="#4de2ff"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle>
<circle cx="723" cy="280" r="3" fill="#9d8bff"><animate attributeName="opacity" values="1;.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
<rect x=".75" y=".75" width="1198.5" height="338.5" rx="21" fill="none" stroke="#27baff" stroke-opacity=".65" stroke-width="1.5"/>
