<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Hassan Khan — software developer</title>
  <desc id="desc">Animated banner with a dark blue gradient, flowing code paths, and the words building software with purpose.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset=".55" stop-color="#101c35"/>
      <stop offset="1" stop-color="#11102c"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".36"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#94a3b8" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="330" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="26" fill="url(#grid)"/>
  <ellipse cx="980" cy="160" rx="350" ry="270" fill="url(#glow)"/>
  <path d="M0 274 C210 220 330 320 540 250 S880 200 1200 260" fill="none" stroke="url(#line)" stroke-opacity=".42" stroke-width="2" stroke-dasharray="7 11">
    <animate attributeName="stroke-dashoffset" from="0" to="-180" dur="12s" repeatCount="indefinite"/>
  </path>
  <path d="M560 0 C700 80 765 40 890 100 S1080 150 1200 92" fill="none" stroke="#38bdf8" stroke-opacity=".25" stroke-width="1.5"/>
  <g fill="none" stroke="url(#line)" stroke-width="1.5" opacity=".55">
    <path d="M740 130h105l28 28h95"/>
    <path d="M780 185h75l25-25h112"/>
    <path d="M700 230h105l22-22h165"/>
    <path d="M840 80h65l25 25h100"/>
  </g>
  <g fill="#7dd3fc">
    <circle cx="845" cy="130" r="3"><animate attributeName="opacity" values=".25;1;.25" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="968" cy="158" r="3"><animate attributeName="opacity" values="1;.25;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="160" r="3"><animate attributeName="opacity" values=".3;1;.3" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="827" cy="208" r="3"><animate attributeName="opacity" values="1;.25;1" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>
  <circle r="4" fill="#67e8f9">
    <animateMotion dur="10s" repeatCount="indefinite" path="M700 130 C820 100 830 190 960 158 S1090 125 1150 80"/>
  </circle>
  <circle r="3" fill="#c4b5fd">
    <animateMotion dur="13s" repeatCount="indefinite" path="M760 230 C860 210 920 95 1020 105 S1090 230 1170 205"/>
  </circle>
  <rect x="72" y="65" width="5" height="192" rx="2.5" fill="url(#line)"/>
  <text x="105" y="104" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="4">SOFTWARE DEVELOPER · AI &amp; PRODUCT BUILDER</text>
  <text x="100" y="173" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="1">HASSAN KHAN</text>
  <text x="104" y="215" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">Building useful software across AI, the web, and developer tools.</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#a5f3fc" opacity=".88">
    <text x="106" y="270">&gt; idea</text><text x="191" y="270" fill="#64748b">→</text>
    <text x="218" y="270">&gt; build</text><text x="313" y="270" fill="#64748b">→</text>
    <text x="340" y="270">&gt; refine</text><rect x="405" y="257" width="8" height="16" rx="1" fill="#67e8f9">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="328.5" rx="25.25" fill="none" stroke="#94a3b8" stroke-opacity=".22" stroke-width="1.5"/>
</svg>
